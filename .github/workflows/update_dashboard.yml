# 毎朝ダッシュボードを自動更新するワークフロー
# JST 7:30（UTC 22:30）に実行。手動実行も可能（Actionsタブ → Run workflow）
name: update-dashboard

on:
  schedule:
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存パッケージのインストール
        run: pip install -r requirements.txt

      - name: データ収集（GA4 / GSC / Ahrefs / HubSpot）
        env:
          GA4_CREDENTIALS_JSON: ${{ secrets.GA4_CREDENTIALS_JSON }}
          GSC_CREDENTIALS_JSON: ${{ secrets.GSC_CREDENTIALS_JSON }}
          AHREFS_TOKEN: ${{ secrets.AHREFS_TOKEN }}
          HUBSPOT_TOKEN: ${{ secrets.HUBSPOT_TOKEN }}
        run: python scripts/collect_all.py

      - name: ダッシュボードHTML生成
        run: python scripts/build_dashboard.py

      - name: パスワード保護ページ生成（docs/index.html）
        env:
          DASH_ID: ${{ secrets.DASH_ID }}
          DASH_PW: ${{ secrets.DASH_PW }}
        run: node scripts/lock_dashboard.js dist/dashboard.html docs/index.html

      - name: 変更をコミット（暗号化済みページとAhrefs履歴のみ）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html data/ahrefs_history.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "自動更新: $(TZ=Asia/Tokyo date +%Y-%m-%d)"
            git push
          fi
