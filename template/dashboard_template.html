<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jagoo マーケティングダッシュボード</title>
<style>
:root{
  color-scheme: light;
  --page:#f9f9f7; --surface-1:#fcfcfb;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --muted:#898781;
  --grid:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,.10);
  --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a; --series-4:#eda100; --series-5:#e87ba4;
  --up:#006300; --down:#d03b3b;
  --accent:#2a78d6; --accent-soft:#e7f0fb;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --page:#0d0d0d; --surface-1:#1a1a19;
    --text-primary:#ffffff; --text-secondary:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
    --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500; --series-5:#d55181;
    --up:#0ca30c; --down:#e66767;
    --accent:#3987e5; --accent-soft:#1d2c40;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0d0d0d; --surface-1:#1a1a19;
  --text-primary:#ffffff; --text-secondary:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,.10);
  --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500; --series-5:#d55181;
  --up:#0ca30c; --down:#e66767;
  --accent:#3987e5; --accent-soft:#1d2c40;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--text-primary);
  font-family:system-ui,-apple-system,"Segoe UI","Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif;
  font-size:14px;line-height:1.6;}
header{padding:18px 24px 0;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;}
header h1{font-size:18px;margin:0;letter-spacing:.02em;}
header .sub{color:var(--muted);font-size:12px;}
header .spacer{flex:1}
#themeBtn{border:1px solid var(--border);background:var(--surface-1);color:var(--text-secondary);
  border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;font-family:inherit;}
.bar{display:flex;gap:4px;padding:10px 24px 0;flex-wrap:wrap;border-bottom:1px solid var(--grid);align-items:center;}
.bar nav{display:flex;gap:4px;flex-wrap:wrap;}
.bar nav button{border:0;background:none;color:var(--text-secondary);font-family:inherit;font-size:13px;
  padding:8px 14px;cursor:pointer;border-bottom:2px solid transparent;}
.bar nav button.on{color:var(--text-primary);font-weight:700;border-bottom-color:var(--accent);}
.bar .sp{flex:1}
.period{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--text-secondary);padding-bottom:8px;}
.period select{font-family:inherit;font-size:12px;padding:4px 6px;border:1px solid var(--border);
  border-radius:6px;background:var(--surface-1);color:var(--text-primary);}
main{padding:18px 24px 40px;max-width:1080px;margin:0 auto;}
.tab{display:none}
.tab.on{display:block}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px;}
.tile{background:var(--surface-1);border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
.tile .k{font-size:12px;color:var(--text-secondary);}
.tile .v{font-size:26px;font-weight:700;margin:2px 0 0;}
.tile .d{font-size:12px;}
.tile .d.up{color:var(--up)} .tile .d.down{color:var(--down)} .tile .d.flat{color:var(--muted)}
.card{background:var(--surface-1);border:1px solid var(--border);border-radius:10px;padding:14px 18px 10px;margin-bottom:16px;min-width:0;}
.card h3{font-size:13px;margin:0 0 2px;}
.card .note{font-size:11px;color:var(--muted);margin:0 0 8px;}
.card .head{display:flex;align-items:baseline;gap:8px;}
.card .head .sp{flex:1}
.tblBtn{border:0;background:none;color:var(--muted);font-size:11px;cursor:pointer;font-family:inherit;text-decoration:underline;}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-secondary);margin:4px 0 2px;}
.legend .it{display:flex;align-items:center;gap:5px;}
.legend .sw{width:10px;height:10px;border-radius:3px;display:inline-block;}
.chartWrap{position:relative;overflow-x:auto;}
svg{display:block}
.tip{position:absolute;pointer-events:none;background:var(--surface-1);border:1px solid var(--border);
  border-radius:8px;padding:7px 10px;font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.15);display:none;z-index:5;min-width:120px;}
.tip .t{color:var(--muted);font-size:11px;margin-bottom:2px;}
.tip .r{display:flex;align-items:center;gap:6px;}
.tip .r b{margin-left:auto;font-variant-numeric:tabular-nums;}
table.dt{border-collapse:collapse;width:100%;font-size:12px;margin:6px 0 8px;}
table.dt th,table.dt td{border-bottom:1px solid var(--grid);padding:5px 8px;text-align:right;font-variant-numeric:tabular-nums;}
table.dt th:first-child,table.dt td:first-child{text-align:left;}
table.dt th{color:var(--text-secondary);font-weight:600;}
table.dt thead th:hover{color:var(--text-primary);text-decoration:underline;}
table.dt tr.total td{font-weight:700;border-top:2px solid var(--baseline);}
table.dt td.l{text-align:left;white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis;}
table.dt a{color:var(--accent);text-decoration:none;}
table.dt a:hover{text-decoration:underline;}
.scrollTbl{max-height:520px;overflow:auto;margin:6px 0 8px;border:1px solid var(--grid);border-radius:8px;}
.scrollTbl table.dt{margin:0;}
.scrollTbl thead th{position:sticky;top:0;background:var(--surface-1);z-index:2;}
.metricSel{font-family:inherit;font-size:12px;padding:4px 6px;border:1px solid var(--border);
  border-radius:6px;background:var(--surface-1);color:var(--text-primary);}
.msg{background:var(--accent-soft);border:1px solid var(--border);border-radius:10px;padding:14px 16px;font-size:13px;margin-bottom:14px;}
.defs h3{font-size:14px;margin:18px 0 4px;}
.defs p, .defs li{font-size:13px;color:var(--text-secondary);}
.err{border-left:3px solid var(--down);padding-left:10px;}
@media (max-width:600px){ main,header,.bar{padding-left:12px;padding-right:12px;} }
</style>
</head>
<body>
<header>
  <h1>jagoo マーケティングダッシュボード</h1>
  <span class="sub" id="genAt"></span>
  <span class="spacer"></span>
  <button id="themeBtn" type="button">表示切替（明/暗）</button>
</header>
<div class="bar">
  <nav id="nav"></nav>
  <span class="sp"></span>
  <div class="period">
    <label for="selS">期間</label>
    <select id="selS"></select>
    <span>〜</span>
    <select id="selE"></select>
  </div>
</div>
<main id="main"></main>

<script>
const DATA = /*DATA@*/null/*@DATA*/;

// ---------------------------------------------------------------- helpers
const cvar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const SERIES = i => cvar('--series-' + (i + 1));
const fmtN = v => v == null ? '-' : Math.round(v).toLocaleString('ja-JP');
const fmtP = (v, d=1) => v == null ? '-' : v.toFixed(d) + '%';
const fmtF = (v, d=1) => v == null ? '-' : v.toFixed(d);
const mLabel = ym => (+ym.slice(0,4)) + '年' + (+ym.slice(5)) + '月';
const mShort = ym => (ym.slice(5) === '01' ? ym.slice(0,4) + '/' : '') + (+ym.slice(5)) + '月';

function el(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const k in (attrs||{})){
    if (k === 'class') e.className = attrs[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  for (const k of kids) e.append(k);
  return e;
}
const svgNS = 'http://www.w3.org/2000/svg';
function sv(tag, attrs, ...kids){
  const e = document.createElementNS(svgNS, tag);
  for (const k in (attrs||{})) e.setAttribute(k, attrs[k]);
  for (const k of kids) e.append(k);
  return e;
}

// ---------------------------------------------------------------- 期間の状態
const FULL = DATA ? DATA.months : [];
let VS = 0, VE = FULL.length - 1;          // 表示範囲（開始・終了のインデックス）
const VM = () => FULL.slice(VS, VE + 1);   // 表示中の月リスト
const lastIsCurrent = () => FULL[VE] === DATA.current_month;

function delta(cur, prev){
  if (cur == null || prev == null || prev === 0) return null;
  return (cur - prev) / prev * 100;
}
function daysInMonth(ym){ return new Date(+ym.slice(0,4), +ym.slice(5), 0).getDate(); }
function elapsedDays(ym){
  // 当月（データ最終日の月）だけは経過日数、それ以外は月の日数
  const end = DATA.range.end;
  return end.slice(0,7) === ym ? +end.slice(8) : daysInMonth(ym);
}

// ---------------------------------------------------------------- tiles
// 表示期間の終了月と、その前月を比較する。件数は日割り（期間の長さ違いをそのまま比べない）
function tile(label, getter, opts){
  opts = opts || {};
  const endYm = FULL[VE], prevYm = FULL[VE - 1];
  const value = getter(endYm), prev = prevYm ? getter(prevYm) : null;
  const t = el('div', {class:'tile'});
  t.append(el('div', {class:'k'}, label + '（' + mLabel(endYm) + (lastIsCurrent() ? '・月途中' : '') + '）'));
  t.append(el('div', {class:'v'}, opts.fmt ? opts.fmt(value) : fmtN(value)));
  let d, body, note = '';
  if (opts.pt){
    d = (value != null && prev != null) ? value - prev : null;
    if (d != null) body = (d >= 0 ? '+' : '') + d.toFixed(1) + 'pt';
  } else {
    const curDaily = value != null ? value / elapsedDays(endYm) : null;
    const prevDaily = (prev != null && prevYm) ? prev / daysInMonth(prevYm) : null;
    d = delta(curDaily, prevDaily);
    if (d != null) body = (d >= 0 ? '+' : '') + d.toFixed(1) + '%';
    if (lastIsCurrent()) note = '（日割り）';
  }
  if (d != null){
    const good = opts.lowerBetter ? d < 0 : d > 0;
    const cls = Math.abs(d) < 0.05 ? 'flat' : (good ? 'up' : 'down');
    const arrow = Math.abs(d) < 0.05 ? '→' : (d > 0 ? '↑' : '↓');
    t.append(el('div', {class:'d ' + cls}, arrow + ' 前月比' + note + ' ' + body));
  } else {
    t.append(el('div', {class:'d flat'}, '前月データなし'));
  }
  return t;
}

// ---------------------------------------------------------------- line chart（横長1カラム）
function lineChart(parent, title, note, series, opts){
  opts = opts || {};
  const M = VM();
  const curIdx = lastIsCurrent() ? M.length - 1 : -1;  // 破線にする月（当月）
  const card = el('div', {class:'card'});
  const head = el('div', {class:'head'});
  head.append(el('h3', {}, title));
  head.append(el('span', {class:'sp'}));
  const btn = el('button', {class:'tblBtn', type:'button'}, '表で見る');
  head.append(btn);
  card.append(head);
  if (note) card.append(el('p', {class:'note'}, note));

  if (series.length >= 2){
    const lg = el('div', {class:'legend'});
    series.forEach((s, i) => {
      const it = el('span', {class:'it'});
      it.append(el('span', {class:'sw', style:'background:' + (s.color || SERIES(i))}));
      it.append(s.name);
      lg.append(it);
    });
    card.append(lg);
  }

  const W = 980, H = 260, padL = 56, padR = 120, padT = 14, padB = 28;
  const wrap = el('div', {class:'chartWrap'});
  const svg = sv('svg', {viewBox:`0 0 ${W} ${H}`, width:'100%', height:'auto', role:'img', 'aria-label': title});
  const all = series.flatMap(s => s.values).filter(v => v != null);
  let max = Math.max(...all, 0), min = opts.zeroBase === false ? Math.min(...all) : 0;
  if (opts.reversed){ max = Math.max(...all) * 1.08; min = Math.min(...all) * 0.9; }
  if (max === min) max = min + 1;
  max = max * 1.06;
  const X = i => padL + (W - padL - padR) * (M.length === 1 ? 0.5 : i / (M.length - 1));
  const Y = v => {
    let r = (v - min) / (max - min);
    if (opts.reversed) r = 1 - r;
    return H - padB - (H - padT - padB) * r;
  };
  for (let g = 1; g <= 4; g++){
    const gv = min + (max - min) * g / 4;
    svg.append(sv('line', {x1:padL, x2:W-padR, y1:Y(gv), y2:Y(gv), stroke:cvar('--grid'), 'stroke-width':1}));
    svg.append(sv('text', {x:padL-6, y:Y(gv)+4, 'text-anchor':'end', 'font-size':10,
      fill:cvar('--muted'), style:'font-variant-numeric:tabular-nums'},
      opts.fmt ? opts.fmt(gv) : fmtN(gv)));
  }
  svg.append(sv('line', {x1:padL, x2:W-padR, y1:H-padB, y2:H-padB, stroke:cvar('--baseline'), 'stroke-width':1}));
  const step = M.length > 8 ? 2 : 1;
  M.forEach((m, i) => {
    if (i % step === 0 || i === M.length - 1)
      svg.append(sv('text', {x:X(i), y:H-8, 'text-anchor':'middle', 'font-size':10, fill:cvar('--muted')}, mShort(m)));
  });
  const endLabels = [], ptLabels = [];
  series.forEach((s, si) => {
    const color = s.color || SERIES(si);
    const pts = s.values.map((v, i) => v == null ? null : [X(i), Y(v)]);
    let solid = '', dash = '';
    for (let i = 0; i < pts.length; i++){
      if (!pts[i]) continue;
      const cmd = (p, acc) => acc + (acc ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1);
      if (curIdx < 0 || i < curIdx) solid = cmd(pts[i], solid);
      if (curIdx >= 0 && (i === curIdx - 1 || i === curIdx)) dash = cmd(pts[i], dash);
    }
    if (solid) svg.append(sv('path', {d:solid, fill:'none', stroke:color, 'stroke-width':2, 'stroke-linejoin':'round'}));
    if (dash) svg.append(sv('path', {d:dash, fill:'none', stroke:color, 'stroke-width':2, 'stroke-dasharray':'4 4'}));
    const lastI = pts.length - 1;
    const last = pts[lastI] || pts.filter(Boolean).slice(-1)[0];
    if (last){
      svg.append(sv('circle', {cx:last[0], cy:last[1], r:3.5, fill:color,
        stroke:cvar('--surface-1'), 'stroke-width':2}));
      const txt = (series.length === 2 ? s.name + ' ' : '') +
        (opts.fmt ? opts.fmt(s.values[lastI]) : fmtN(s.values[lastI]));
      endLabels.push({x: last[0] + 8, y: last[1] + 4, txt});
    }
    // 各月の数値ラベル（最終月は右端のラベルに任せるため除外）
    const endI = pts[lastI] ? lastI : pts.reduce((a, p, i) => p ? i : a, -1);
    pts.forEach((p, i) => {
      if (!p || i === endI) return;
      // はっきりした谷（両隣より8px以上低い点）はラベルを点の下に置き、線との重なりを避ける
      const pv = pts[i-1], nx = pts[i+1];
      const below = pv && nx && p[1] > pv[1] + 8 && p[1] > nx[1] + 8;
      ptLabels.push({gi:i, x:p[0], py:p[1], below, color,
        txt: opts.fmt ? opts.fmt(s.values[i]) : fmtN(s.values[i])});
    });
  });
  // 数値ラベルの配置。基本は点の上に置き、同じ月で重なる場合は点の下→さらに下へ順にずらす
  const xGap = (W - padL - padR) / Math.max(M.length - 1, 1);
  const byMonth = {};
  ptLabels.forEach(l => (byMonth[l.gi] = byMonth[l.gi] || []).push(l));
  Object.values(byMonth).forEach(g => {
    g.sort((a, b) => a.py - b.py);
    let lastY = -Infinity;
    g.forEach(l => {
      let y = l.below ? l.py + 14 : l.py - 6;
      if (g.length === 1 && xGap < 46 && l.gi % 2) y -= 10;  // 月数が多い時は交互に高さを変えて横の重なりを防ぐ
      if (y - lastY < 11) y = Math.max(l.py + 14, lastY + 11);
      y = Math.max(y, padT + 8);
      if (y - lastY < 11) y = lastY + 11;
      l.ly = y; lastY = y;
    });
    // 下にはみ出したラベルは、間隔を保ったまま全体を上へ押し戻す
    for (let k = g.length - 1, cap = H - padB + 4; k >= 0; k--){
      if (g[k].ly > cap) g[k].ly = cap;
      cap = g[k].ly - 11;
    }
  });
  ptLabels.forEach(l => svg.append(sv('text', {x:l.x, y:l.ly, 'text-anchor':'middle',
    'font-size':9, fill:l.color, stroke:cvar('--surface-1'), 'stroke-width':3,
    'paint-order':'stroke', style:'font-variant-numeric:tabular-nums'}, l.txt)));
  endLabels.sort((a, b) => a.y - b.y);
  for (let i = 1; i < endLabels.length; i++){
    if (endLabels[i].y - endLabels[i-1].y < 12) endLabels[i].y = endLabels[i-1].y + 12;
  }
  if (endLabels.length && endLabels[endLabels.length-1].y > H - padB + 10){
    const shift = endLabels[endLabels.length-1].y - (H - padB + 10);
    endLabels.forEach(l => l.y -= shift);
  }
  endLabels.forEach(l => svg.append(
    sv('text', {x:l.x, y:l.y, 'font-size':10, fill:cvar('--text-secondary')}, l.txt)));

  const cross = sv('line', {y1:padT, y2:H-padB, stroke:cvar('--baseline'), 'stroke-width':1, 'stroke-dasharray':'2 3', visibility:'hidden'});
  svg.append(cross);
  const tip = el('div', {class:'tip'});
  const hit = sv('rect', {x:padL, y:padT, width:W-padL-padR, height:H-padT-padB, fill:'transparent'});
  svg.append(hit);
  hit.addEventListener('mousemove', ev => {
    const r = svg.getBoundingClientRect();
    const sx = (ev.clientX - r.left) / r.width * W;
    let i = Math.round((sx - padL) / ((W - padL - padR) / Math.max(M.length - 1, 1)));
    i = Math.max(0, Math.min(M.length - 1, i));
    cross.setAttribute('x1', X(i)); cross.setAttribute('x2', X(i));
    cross.setAttribute('visibility', 'visible');
    tip.replaceChildren(el('div', {class:'t'}, mLabel(M[i]) + (i === curIdx ? '（月途中）' : '')));
    series.forEach((s, si) => {
      const row = el('div', {class:'r'});
      row.append(el('span', {class:'sw', style:'width:8px;height:8px;border-radius:2px;background:' + (s.color || SERIES(si))}));
      row.append(el('span', {}, s.name));
      row.append(el('b', {}, opts.fmt ? opts.fmt(s.values[i]) : fmtN(s.values[i])));
      tip.append(row);
    });
    tip.style.display = 'block';
    const px = X(i) / W * r.width;
    tip.style.left = Math.min(px + 12, r.width - 160) + 'px';
    tip.style.top = '26px';
  });
  hit.addEventListener('mouseleave', () => { tip.style.display = 'none'; cross.setAttribute('visibility', 'hidden'); });
  wrap.append(svg); wrap.append(tip);
  card.append(wrap);

  const tbl = el('table', {class:'dt', style:'display:none'});
  const lcHead = el('thead', {}), lcBody = el('tbody', {});
  const hr = el('tr', {}); hr.append(el('th', {}, '月'));
  series.forEach(s => hr.append(el('th', {}, s.name)));
  lcHead.append(hr);
  M.forEach((m, i) => {
    const tr = el('tr', {});
    const tdM = el('td', {}, mLabel(m) + (i === curIdx ? '（途中）' : ''));
    tdM.dataset.sort = m;  // 月は年月キーで並び替える（文字列比較の月順ズレ防止）
    tr.append(tdM);
    series.forEach(s => tr.append(el('td', {}, opts.fmt ? opts.fmt(s.values[i]) : fmtN(s.values[i]))));
    lcBody.append(tr);
  });
  tbl.append(lcHead); tbl.append(lcBody);
  makeSortable(tbl);
  card.append(tbl);
  btn.addEventListener('click', () => {
    const show = tbl.style.display === 'none';
    tbl.style.display = show ? '' : 'none';
    wrap.style.display = show ? 'none' : '';
    btn.textContent = show ? 'グラフで見る' : '表で見る';
  });
  parent.append(card);
}

function series(getter){ return VM().map(m => { try { const v = getter(m); return v == null ? null : v; } catch(e){ return null; } }); }

// ---------------------------------------------------------------- 表の並び替え
// 列見出しクリックで昇順・降順を切り替える。「合計」行（class=total）は常に先頭に固定。
// セルに data-sort があればその値で、なければ表示文字列（数値らしければ数値）で比較する。
function makeSortable(tbl){
  const thead = tbl.querySelector('thead');
  const tbody = tbl.querySelector('tbody');
  if (!thead || !tbody) return;
  const ths = [...thead.querySelectorAll('th')];
  const parseNum = s => {
    const t = s.replace(/[,%+秒]/g, '').trim();
    if (t === '' || t === '-') return null;
    const n = parseFloat(t);
    return isNaN(n) ? null : n;
  };
  ths.forEach((th, ci) => {
    th.style.cursor = 'pointer';
    th.title = 'クリックで並び替え';
    th.addEventListener('click', () => {
      const dir = th.dataset.dir === 'asc' ? 'desc' : 'asc';
      ths.forEach(x => { delete x.dataset.dir;
        x.textContent = x.textContent.replace(/ ?[▲▼]$/, ''); });
      th.dataset.dir = dir;
      th.textContent = th.textContent + (dir === 'asc' ? ' ▲' : ' ▼');
      const rows = [...tbody.querySelectorAll('tr')];
      const pinned = rows.filter(r => r.classList.contains('total'));
      const body = rows.filter(r => !r.classList.contains('total'));
      const keyOf = r => { const c = r.children[ci]; return c ? (c.dataset.sort ?? c.textContent) : ''; };
      const hasKey = body.some(r => r.children[ci] && r.children[ci].dataset.sort != null);
      const numeric = !hasKey && body.some(r => parseNum(keyOf(r)) != null);
      body.sort((a, b) => {
        const ka = keyOf(a), kb = keyOf(b);
        let cmp;
        if (numeric){
          const na = parseNum(ka), nb = parseNum(kb);
          if (na == null && nb == null) return 0;
          if (na == null) return 1;   // 値なし（-）は常に末尾
          if (nb == null) return -1;
          cmp = na - nb;
        } else {
          cmp = String(ka).localeCompare(String(kb), 'ja');
        }
        return dir === 'asc' ? cmp : -cmp;
      });
      tbody.replaceChildren(...pinned, ...body);
    });
  });
}

    ]);
    lineChart(t25, 'サービスページCVと平均CVRの推移',
      'CV＝各サービスの資料DL・問い合わせCV＋Eコマース総合資料CV（GA4キーイベント・国フィルタなし）。平均CVR＝CV÷合計セッション', [
      {name:'平均CVR', values: series(seCvr)},
    ], {fmt:v=>fmtP(v,2)});
    lineChart(t25, 'サービスページCVの推移',
      'GA4キーイベント基準の件数。HubSpot計測値とは一致しない月がある（目標管理はKPIシートのHubSpot値を使う）', [
      {name:'サービスページCV', values: series(seCv)},
    ]);
  }

  // ============================ SEO・流入詳細
  const t3 = addTab('SEO・流入詳細');

  // ---- SEO記事別 月次実績（注力KW付き・指標切り替え）
  const artCard = el('div', {class:'card'});
  const artHead = el('div', {class:'head'});
  artHead.append(el('h3', {}, 'SEO記事別 月次実績'));
  artHead.append(el('span', {class:'sp'}));
  const artSel = el('select', {class:'metricSel'});
  artSel.append(el('option', {value:'sessions'}, 'セッション数（GA4）'));
  artSel.append(el('option', {value:'gsc_impr'}, 'GSC 表示回数'));
  artSel.append(el('option', {value:'gsc_clicks'}, 'GSC クリック数'));
  artSel.append(el('option', {value:'position'}, '平均掲載順位（GSC）'));
  artSel.append(el('option', {value:'todoc'}, '記事→資料DL遷移率'));
  const granSel = el('select', {class:'metricSel', style:'display:none'});
  granSel.append(el('option', {value:'month'}, '月別'));
  granSel.append(el('option', {value:'week'}, '週別（月〜日）'));
  granSel.append(el('option', {value:'day'}, '日別'));
  artHead.append(granSel);
  artHead.append(artSel);
  artCard.append(artHead);
  artCard.append(el('p', {class:'note'},
    'セッション数＝その記事がサイト到着時の最初のページだったセッション数（流入経路は問わない。GA4・国=日本のみ）。' +
    'GSC表示回数＝Google検索結果にその記事が表示された回数、GSCクリック数＝クリックされた回数（Search Console）。' +
    'GSC表示回数・クリック数は右のプルダウンで月別／週別（月曜〜日曜）／日別（選択期間の直近31日）を切り替えられます。' +
    '平均掲載順位＝検索結果に表示されたときの平均順位（表示回数で加重した月平均。小さいほど上位）。' +
    '記事→資料DL遷移率＝その記事から資料ページ（/document/）へ移動したPV÷その記事の全PV（近似値・低めに出る）。' +
    '注力KWはHiroto提供リスト（2026-08-08時点・165記事）。先頭の「全記事 合計」行はサイト内の全記事の合計値。' +
    '列見出しをクリックすると昇順・降順で並び替えできます（合計行は先頭に固定）'));
  const artTblWrap = el('div', {class:'scrollTbl'});
  artCard.append(artTblWrap);

  // 日付ユーティリティ（時差ズレ防止のため手組みで整形）
  const isoOf = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  const dateOf = iso => new Date(+iso.slice(0,4), +iso.slice(5,7)-1, +iso.slice(8,10));
  function monthEndIso(ym){ return isoOf(new Date(+ym.slice(0,4), +ym.slice(5), 0)); }

  // GSC日次データ用: 表示粒度に応じた期間リストと「日付→期間番号」の対応表を作る
  function gscPeriods(gran){
    const startIso = FULL[VS] + '-01';
    const endIso = DATA.range.end < monthEndIso(FULL[VE]) ? DATA.range.end : monthEndIso(FULL[VE]);
    const periods = [], idx = new Map();
    if (gran === 'month'){
      VM().forEach((m, i) => periods.push({label: mShort(m) + (m === DATA.current_month ? '※' : '')}));
      let d = dateOf(startIso);
      const end = dateOf(endIso);
      while (d <= end){ const i = VM().indexOf(isoOf(d).slice(0,7)); if (i >= 0) idx.set(isoOf(d), i); d.setDate(d.getDate()+1); }
    } else if (gran === 'week'){
      let d = dateOf(startIso);
      d.setDate(d.getDate() - ((d.getDay() + 6) % 7));  // その週の月曜まで戻る
      const end = dateOf(endIso);
      while (d <= end){
        periods.push({label: (d.getMonth()+1) + '/' + d.getDate() + '週'});
        for (let k = 0; k < 7; k++){
          const dd = new Date(d); dd.setDate(d.getDate()+k);
          idx.set(isoOf(dd), periods.length - 1);
        }
        d.setDate(d.getDate() + 7);
      }
    } else {
      // 日別は選択期間の直近31日
      const end = dateOf(endIso);
      let s = new Date(end); s.setDate(end.getDate() - 30);
      if (isoOf(s) < startIso) s = dateOf(startIso);
      let d = new Date(s);
      while (d <= end){
        periods.push({label: (d.getMonth()+1) + '/' + d.getDate()});
        idx.set(isoOf(d), periods.length - 1);
        d.setDate(d.getDate()+1);
      }
    }
    return {periods, idx};
  }

  function renderArtTbl(){
    const metric = artSel.value;
    const isGsc = metric === 'gsc_impr' || metric === 'gsc_clicks';
    granSel.style.display = isGsc ? '' : 'none';
    const gran = isGsc ? granSel.value : 'month';
    const arts = DATA.articles || {};
    const poss = DATA.article_positions || {};
    const af = DATA.article_funnel || {};
    const ag = DATA.article_gsc || {};
    const kws = DATA.article_keywords || {};
    const gi = metric === 'gsc_clicks' ? 0 : 1;  // 日次データ [クリック, 表示回数]

    // 記事ごとの月次表示回数（順位の加重平均用）
    const imprByMonth = p => {
      const out = {};
      for (const d in (ag[p] || {})){ const ym = d.slice(0,7);
        out[ym] = (out[ym] || 0) + ag[p][d][1]; }
      return out;
    };

    const paths = [...new Set([...Object.keys(arts), ...Object.keys(poss), ...Object.keys(ag)])];
    const sesSum = p => VM().reduce((s, m) => s + ((arts[p] || {})[m] || 0), 0);

    let periods, dateIdx = null;
    if (isGsc){
      const g = gscPeriods(gran);
      periods = g.periods; dateIdx = g.idx;
    } else {
      periods = VM().map(m => ({label: mShort(m) + (m === DATA.current_month ? '※' : '')}));
    }

    // 記事×期間の値を先に計算（並び替え・合計行にも使う）
    const rowVals = new Map();
    paths.forEach(p => {
      const vals = new Array(periods.length).fill(null);
      if (isGsc){
        for (let i = 0; i < vals.length; i++) vals[i] = 0;
        for (const d in (ag[p] || {})){
          const i = dateIdx.get(d);
          if (i != null) vals[i] += ag[p][d][gi];
        }
      } else if (metric === 'sessions'){
        VM().forEach((m, i) => { vals[i] = (arts[p] || {})[m] || 0; });
      } else if (metric === 'position'){
        VM().forEach((m, i) => { vals[i] = (poss[p] || {})[m] ?? null; });
      } else {
        VM().forEach((m, i) => {
          const f = ((af[p] || {})[m]) || null;
          vals[i] = f && f.pv ? f.to_doc / f.pv * 100 : null;
        });
      }
      rowVals.set(p, vals);
    });
    const numSum = p => rowVals.get(p).reduce((s, v) => s + (v || 0), 0);

    // 並び順: 件数系はその指標の期間合計、順位・遷移率はセッション合計
    if (isGsc) paths.sort((a, b) => numSum(b) - numSum(a));
    else paths.sort((a, b) => sesSum(b) - sesSum(a));

    const tbl = el('table', {class:'dt'});
    const thead = el('thead', {}), tbody = el('tbody', {});
    const hr = el('tr', {});
    hr.append(el('th', {}, '注力KW'));
    hr.append(el('th', {}, '記事'));
    periods.forEach(pr => hr.append(el('th', {}, pr.label)));
    hr.append(el('th', {}, metric === 'position' ? '期間平均' : metric === 'todoc' ? '期間率' : '期間計'));
    thead.append(hr);

    // 合計行（全記事）
    const trT = el('tr', {class:'total'});
    trT.append(el('td', {class:'l'}, '全記事 合計'));
    trT.append(el('td', {class:'l'}, ''));
    if (metric === 'position'){
      // 表示回数で加重した全記事平均
      let wsumAll = 0, wAll = 0;
      VM().forEach((m, i) => {
        let wsum = 0, w = 0;
        paths.forEach(p => {
          const pos = (poss[p] || {})[m];
          if (pos == null) return;
          const impr = imprByMonth(p)[m] || 0;
          wsum += pos * impr; w += impr;
        });
        wsumAll += wsum; wAll += w;
        trT.append(el('td', {}, w ? fmtF(wsum / w, 1) : '-'));
      });
      trT.append(el('td', {}, wAll ? fmtF(wsumAll / wAll, 1) : '-'));
    } else if (metric === 'todoc'){
      const fs = VM().map(m => { let pv = 0, td = 0;
        paths.forEach(p => { const f = ((af[p] || {})[m]); if (f){ pv += f.pv; td += f.to_doc; } });
        return [pv, td]; });
      fs.forEach(([pv, td]) => trT.append(el('td', {}, pv ? fmtP(td / pv * 100, 2) : '-')));
      const pvA = fs.reduce((s, x) => s + x[0], 0), tdA = fs.reduce((s, x) => s + x[1], 0);
      trT.append(el('td', {}, pvA ? fmtP(tdA / pvA * 100, 2) : '-'));
    } else {
      const totals = new Array(periods.length).fill(0);
      paths.forEach(p => rowVals.get(p).forEach((v, i) => { totals[i] += v || 0; }));
      totals.forEach(v => trT.append(el('td', {}, fmtN(v))));
      trT.append(el('td', {}, fmtN(totals.reduce((s, v) => s + v, 0))));
    }
    tbody.append(trT);

    paths.forEach(p => {
      // 期間内の実績がゼロの記事は省略（順位表示は除く）
      if (metric !== 'position' && numSum(p) === 0) return;
      const tr = el('tr', {});
      tr.append(el('td', {class:'l'}, kws[p] || '-'));
      const a = el('a', {href:'https://jagoo.co.jp' + p + '/', target:'_blank', rel:'noopener'},
        p.replace('/column/', ''));
      const tdUrl = el('td', {class:'l'}); tdUrl.append(a); tr.append(tdUrl);
      const vals = rowVals.get(p);
      vals.forEach(v => {
        let disp;
        if (metric === 'position') disp = v == null ? '-' : fmtF(v, 1);
        else if (metric === 'todoc') disp = v == null ? '-' : fmtP(v, 2);
        else disp = fmtN(v || 0);
        tr.append(el('td', {}, disp));
      });
      if (metric === 'position'){
        const nn = vals.filter(v => v != null);
        tr.append(el('td', {}, nn.length ? fmtF(nn.reduce((s, v) => s + v, 0) / nn.length, 1) : '-'));
      } else if (metric === 'todoc'){
        let pv = 0, td = 0;
        VM().forEach(m => { const f = ((af[p] || {})[m]); if (f){ pv += f.pv; td += f.to_doc; } });
        tr.append(el('td', {}, pv ? fmtP(td / pv * 100, 2) : '-'));
      } else {
        tr.append(el('td', {}, fmtN(numSum(p))));
      }
      tbody.append(tr);
    });
    tbl.append(thead); tbl.append(tbody);
    makeSortable(tbl);
    artTblWrap.replaceChildren(tbl);
  }
  granSel.addEventListener('change', renderArtTbl);
  artSel.addEventListener('change', renderArtTbl);
  renderArtTbl();
  artCard.append(el('p', {class:'note'}, '※当月は月途中の数値。セッション表示では期間内の流入がゼロの記事を省略しています'));
  t3.append(artCard);

  lineChart(t3, 'GSC 表示回数',
    'Google検索結果にjagoo.co.jpのページが表示された回数（クリック前の露出量。Search Console）', [
    {name:'表示回数', values: series(m => gsc(m).impressions)},
  ]);
  lineChart(t3, 'GSC 平均掲載順位',
    'サイト全体の検索結果での平均順位（Search Console・表示回数で加重）。上にいくほど良い（軸を反転表示）', [
    {name:'平均順位', values: series(m => gsc(m).position)},
  ], {reversed:true, fmt:v=>fmtF(v,1), zeroBase:false});
  const chTotals = {};
  VM().forEach(m => { const c = (ga.channels||{})[m] || {};
    for (const k in c) chTotals[k] = (chTotals[k]||0) + c[k].sessions; });
  const top4 = Object.keys(chTotals).sort((a,b)=>chTotals[b]-chTotals[a]).slice(0,4);
  const chSeries = top4.map(k => ({name:k, values: series(m => ((ga.channels||{})[m]||{})[k] ? ((ga.channels||{})[m]||{})[k].sessions : 0)}));
  chSeries.push({name:'その他', values: series(m => {
    const c = (ga.channels||{})[m] || {}; let s = 0;
    for (const k in c) if (!top4.includes(k)) s += c[k].sessions; return s; })});
  lineChart(t3, 'チャネル別セッション',
    'GA4のデフォルトチャネルグループ別のセッション数（Organic Search＝検索、Direct＝URL直接入力やブックマーク、Referral＝他サイトのリンク、Paid系＝広告）。上位4チャネル＋その他。' + JP_DEF, chSeries);
  const ah = DATA.ahrefs || {};
  const ahDates = Object.keys(ah).sort();
  const ahByMonth = m => { const d = ahDates.filter(x => x.slice(0,7) === m).slice(-1)[0]; return d ? ah[d] : {}; };
  lineChart(t3, 'Ahrefs 検索順位キーワード数',
    'jagoo.co.jpがGoogle検索結果（100位以内）に表示されているキーワードの総数（Ahrefs調べ・各月末時点のスナップショット）', [
    {name:'KW総数', values: series(m => ahByMonth(m).org_keywords)},
  ]);
  lineChart(t3, 'Ahrefs 1〜3位キーワード数',
    'そのうち検索結果の1〜3位に表示されているキーワードの数（Ahrefs調べ・各月末時点）', [
    {name:'1〜3位KW', values: series(m => ahByMonth(m).org_keywords_1_3)},
  ]);
  lineChart(t3, 'Ahrefs ドメインレーティング',
    '被リンク（他サイトからのリンク）の量と質から算出されるサイトの強さの指標（0〜100・Ahrefs独自スコア・各月末時点）', [
    {name:'DR', values: series(m => ahByMonth(m).domain_rating)},
  ], {fmt:v=>fmtF(v,0), zeroBase:false});

  // ============================ 定義
  const t5 = addTab('定義・データソース');
  const d = el('div', {class:'defs'});
  d.innerHTML = `
  <h3>データソースと更新</h3>
  <p>毎朝、GitHub Actions（自動実行の仕組み）がGA4・Search Console・AhrefsのAPIからデータを取得して、このページを作り直しています。当月の数値は月途中のもので、グラフでは破線で表示しています。GSCは直近2日ほどのデータが未確定のため少なめに出ます。HubSpotの数値は現在このダッシュボードには含めていません。</p>
  <h3>指標の定義</h3>
  <ul>
    <li>セッション・CV・新規ユーザー: GA4。海外ボット除外のため国=日本のみで集計。CVはGA4のキーイベント合計（対象イベント: ${CVE}）</li>
    <li>SEO記事: サイト到着時の最初のページが /column/ 配下のセッション（流入経路は問わずすべて含む）</li>
    <li>記事→資料DLページ遷移率: /column/から/document/へ移動したページビュー ÷ /column/のページビュー（移動元が取れない閲覧があるため低めに出る近似値）</li>
    <li>資料DL完了: お役立ち資料のサンクスページ（URLに complete/ を含む）に到達したセッション数。資料DL完了率 = DL完了セッション ÷ /document/閲覧セッション</li>
    <li>サービス別ファネル: /service/◯◯/（ページ閲覧）→ /service/◯◯/document/（資料DLページ）→ /service/◯◯/document/thanks/（DL完了）の各セッション数。対象は楽天・Amazon・Yahoo!・Qoo10・TikTok Shop・ECサイト構築・LP制作・広告運用の8サービス</li>
    <li>モールジャンル: URLに rakuten / amazon / yahoo / qoo10 / tiktok を含むかで判別し、どれにも当てはまらないページは「その他」。記事は記事URL、資料DLページ・DL完了ページはそのページ自身のURLで判別</li>
    <li>記事→資料DL遷移率（記事別・ジャンル別）: その記事から/document/へ移動したページビュー ÷ その記事のページビュー。移動元が取れない閲覧があるため低めに出る近似値</li>
    <li>TOP・サービス流入タブ: TOP（/）とサービス8ページを見たセッション（到達）を、(a)回遊到達＝到達−着地（記事などサイト内から移動して来た分）、(b)サービスページ直接着地、(c)TOP直接着地、の3経路に分解。複数ページを見た訪問はページごとに数えるため合計に重複があり、KPIシートのCVRツリーと同じ基準。サービスページCVは各サービスの資料DL・問い合わせCV＋Eコマース総合資料CV（GA4キーイベント）で、CVR計測シートと突合できるよう国フィルタなしで集計（セッション側は国=日本のみ）。平均CVR＝サービスページCV÷合計セッション</li>
    <li>指名検索: Search Console で検索語に「ジャグー株式会社」「ジャグー」「jagoo」のいずれかを含むクリック数</li>
    <li>Ahrefs: 月末時点のスナップショット。KW総数=検索結果に載っているキーワード数、DR=被リンク評価（0〜100）</li>
  </ul>
  <h3>期間フィルタ</h3>
  <p>画面右上の「期間」で開始月・終了月を選ぶと、全タブのグラフ・表・上部の数値カードがその期間に切り替わります。数値カードは期間の終了月とその前月の比較です。</p>`;
  t5.append(d);

  const i = Math.min(activeTab, tabs.length - 1);
  tabs[i][0].classList.add('on'); tabs[i][1].classList.add('on');
}

// ---------------------------------------------------------------- 期間セレクタ
function initPeriod(){
  const selS = document.getElementById('selS'), selE = document.getElementById('selE');
  function fill(sel, val){
    sel.replaceChildren();
    FULL.forEach((m, i) => {
      const o = el('option', {value:i}, mLabel(m));
      if (i === val) o.selected = true;
      sel.append(o);
    });
  }
  fill(selS, VS); fill(selE, VE);
  function onChange(){
    VS = +selS.value; VE = +selE.value;
    if (VS > VE){ [VS, VE] = [VE, VS]; fill(selS, VS); fill(selE, VE); }
    build();
  }
  selS.addEventListener('change', onChange);
  selE.addEventListener('change', onChange);
}

document.getElementById('themeBtn').addEventListener('click', () => {
  const r = document.documentElement;
  const curDark = r.getAttribute('data-theme') === 'dark' ||
    (!r.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
  r.setAttribute('data-theme', curDark ? 'light' : 'dark');
  build();
});
if (DATA){ initPeriod(); }
build();
</script>
